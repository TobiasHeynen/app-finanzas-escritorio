<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chanchito</title>
    <meta
      name="description"
      content="Finanzas personales: gastos, tarjetas, cuotas y ahorros. Tus datos quedan en tu iPhone."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chanchito" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f15" media="(prefers-color-scheme: dark)" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0d0f15;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Chanchito necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
