name: release-android

# Al subir un tag `android-v1.2.3`: arma el APK y el AAB firmados con la clave de subida y crea un
# release de GitHub con el APK (para instalar sin Play). El AAB queda como artifact para subirlo a Play.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      # Play exige un versionCode mayor en cada subida: minutos desde 2026-01-01, que sube igual en
      # `build` y en `release-android` (cada workflow tiene su propio run_number).
      - name: versionCode
        run: echo "CHANCHITO_VERSION_CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/mobile
      - name: Chequear que estén los secrets de la clave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltan los secrets ANDROID_UPLOAD_* (ver apps/mobile/PLAY.md)"
            exit 1
          fi
      - name: APK y AAB firmados
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          CHANCHITO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CHANCHITO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CHANCHITO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export CHANCHITO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CHANCHITO_UPLOAD_STORE_FILE"
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
          rm -f "$CHANCHITO_UPLOAD_STORE_FILE"
      - name: Renombrar
        id: files
        run: |
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/chanchito-$version.apk"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "dist/chanchito-$version.aab"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: chanchito-android-release
          path: dist/*
          if-no-files-found: error
      - name: Release de GitHub con el APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/chanchito-$VERSION.apk" \
            --title "Chanchito para Android $VERSION" \
            --notes-file apps/mobile/RELEASE_NOTES.md
