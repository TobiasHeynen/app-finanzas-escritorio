name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: E2E
        run: npx playwright test
      - name: Instalador NSIS y paquete para Microsoft Store
        run: npx electron-builder --win nsis appx --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: chanchito-instalador
          path: release/*/chanchito-setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: chanchito-store
          path: release/*/chanchito-*.appx
          if-no-files-found: error
